services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp_test_password
      MYSQL_ROOT_PASSWORD: root_test_password
    ports:
      - "127.0.0.1:33069:3306"
  wordpress:
    image: wordpress:6.7-php8.2-apache
    depends_on:
      - db
    ports:
      - "127.0.0.1:8088:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_test_password
      WORDPRESS_DB_NAME: wordpress_test
    volumes:
      - ../src/htd-ai-seo-writer-pro:/var/www/html/wp-content/plugins/htd-ai-seo-writer-pro
