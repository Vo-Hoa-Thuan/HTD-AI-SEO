name: HTD isolated QA
on:
  push:
    branches:
      - qa/automated-ci
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: htd-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, curl, mysqli, fileinfo, dom, xml
          coverage: none
      - name: PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-output
          find src/htd-ai-seo-writer-pro -name '*.php' -print0 | xargs -0 -n1 php -l | tee qa-output/php-lint.log
          find src/htd-ai-seo-writer-pro -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Run all eight existing regression scripts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p qa-output
          failed=0
          for test in tests/run_phase{02,03,04,05,06,07}_tests.php tests/run_remediation_tests.php tests/run_v3_remediation_tests.php; do
            php "$test" 2>&1 | tee "qa-output/$(basename "$test").log" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-php-${{ matrix.php }}
          path: qa-output/
          retention-days: 7
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wp
          MYSQL_PASSWORD: ci_disposable_password
          MYSQL_ROOT_PASSWORD: ci_disposable_root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, openssl, curl, mysqli, fileinfo, dom, xml, zip, gd
          tools: wp-cli
          coverage: none
      - name: Install isolated WordPress and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/htd-wp" qa-output
          wp --path="$RUNNER_TEMP/htd-wp" core download --version=6.7.2
          wp --path="$RUNNER_TEMP/htd-wp" config create --dbname=wordpress_test --dbuser=wp --dbpass=ci_disposable_password --dbhost=127.0.0.1:3306 --dbprefix=htdci_
          wp --path="$RUNNER_TEMP/htd-wp" core install --url=http://127.0.0.1:8088 --title="Disposable HTD QA" --admin_user=ci_admin --admin_password="$(openssl rand -hex 24)" --admin_email=ci@example.invalid --skip-email
          wp --path="$RUNNER_TEMP/htd-wp" plugin install woocommerce --version=9.6.2
          wp --path="$RUNNER_TEMP/htd-wp" plugin install seo-by-rank-math --version=1.0.238
          wp --path="$RUNNER_TEMP/htd-wp" config set WP_HTTP_BLOCK_EXTERNAL true --raw
          wp --path="$RUNNER_TEMP/htd-wp" config set DISABLE_WP_CRON true --raw
          wp --path="$RUNNER_TEMP/htd-wp" config set WP_DEBUG true --raw
          wp --path="$RUNNER_TEMP/htd-wp" config set WP_DEBUG_LOG true --raw
          wp --path="$RUNNER_TEMP/htd-wp" config set WP_DEBUG_DISPLAY false --raw
          wp --path="$RUNNER_TEMP/htd-wp" plugin activate woocommerce seo-by-rank-math
          (cd src && zip -qr "$RUNNER_TEMP/htd-ci.zip" htd-ai-seo-writer-pro)
          unzip -t "$RUNNER_TEMP/htd-ci.zip"
          wp --path="$RUNNER_TEMP/htd-wp" plugin install "$RUNNER_TEMP/htd-ci.zip" --activate
      - name: Real runtime assertions and reactivation
        env:
          HTD_CI_DISPOSABLE: '1'
        shell: bash
        run: |
          set -euo pipefail
          wp --path="$RUNNER_TEMP/htd-wp" --user=ci_admin eval-file "$GITHUB_WORKSPACE/tests/ci/wp-runtime-smoke.php" | tee qa-output/runtime.log
          wp --path="$RUNNER_TEMP/htd-wp" plugin deactivate htd-ai-seo-writer-pro
          wp --path="$RUNNER_TEMP/htd-wp" plugin activate htd-ai-seo-writer-pro
          wp --path="$RUNNER_TEMP/htd-wp" --user=ci_admin eval-file "$GITHUB_WORKSPACE/tests/ci/wp-runtime-smoke.php" | tee qa-output/reactivation.log
      - name: Collect debug log
        if: always()
        shell: bash
        run: |
          mkdir -p qa-output
          if [ -f "$RUNNER_TEMP/htd-wp/wp-content/debug.log" ]; then
            cp "$RUNNER_TEMP/htd-wp/wp-content/debug.log" qa-output/wp-debug.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-runtime-smoke
          path: qa-output/
          retention-days: 7
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: mbstring, dom, xml
          coverage: none
      - name: Install local scanners
        run: |
          mkdir -p qa-output "$RUNNER_TEMP/qa-tools"
          composer --working-dir="$RUNNER_TEMP/qa-tools" require --no-interaction --no-plugins --no-scripts squizlabs/php_codesniffer phpstan/phpstan wp-coding-standards/wpcs phpcompatibility/php-compatibility
          "$RUNNER_TEMP/qa-tools/vendor/bin/phpcs" --config-set installed_paths "$RUNNER_TEMP/qa-tools/vendor/wp-coding-standards/wpcs,$RUNNER_TEMP/qa-tools/vendor/phpcompatibility/php-compatibility"
          "$RUNNER_TEMP/qa-tools/vendor/bin/phpcs" -i
      - name: WordPress standards
        run: |
          set -o pipefail
          "$RUNNER_TEMP/qa-tools/vendor/bin/phpcs" --standard=WordPress --extensions=php src/htd-ai-seo-writer-pro | tee qa-output/wpcs.log
      - name: PHP compatibility
        if: always()
        run: |
          set -o pipefail
          "$RUNNER_TEMP/qa-tools/vendor/bin/phpcs" --standard=PHPCompatibility --runtime-set testVersion 8.1- --extensions=php src/htd-ai-seo-writer-pro | tee qa-output/php-compatibility.log
      - name: PHPStan baseline diagnostics
        if: always()
        run: |
          set -o pipefail
          "$RUNNER_TEMP/qa-tools/vendor/bin/phpstan" analyse --level=1 --no-progress --memory-limit=512M src/htd-ai-seo-writer-pro | tee qa-output/phpstan.log
      - name: Install Semgrep
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep
      - name: Semgrep source scan
        if: always()
        env:
          SEMGREP_SEND_METRICS: off
        run: |
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --metrics=off --config=p/php --error --json --output=qa-output/semgrep.json src/htd-ai-seo-writer-pro
      - name: Install local antivirus and secret scanners
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav yara golang-go
          GOBIN="$RUNNER_TEMP" go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan Git history (redacted)
        if: always()
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact=100 --report-format=json --report-path=qa-output/gitleaks.json .
      - name: ClamAV source scan
        if: always()
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan -r --infected --log=qa-output/clamav.log src/htd-ai-seo-writer-pro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-diagnostics
          path: qa-output/
          retention-days: 7
